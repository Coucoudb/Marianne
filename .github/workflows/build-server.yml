name: Build Server

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        type: string
        default: '0.0.0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        type: string
        default: '0.0.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-server:
    name: Server (${{ matrix.platform-name }}-${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────────────────────
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            variant: cpu
            features: "fastembed,vectordb"
            platform-name: windows-x64
            needs-vulkan: false

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            variant: cuda
            features: "fastembed,vectordb,cuda"
            platform-name: windows-x64
            needs-vulkan: false

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            variant: vulkan
            features: "fastembed,vectordb,vulkan"
            platform-name: windows-x64
            needs-vulkan: true

          # ── Linux ────────────────────────────────────────────────────────
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: cpu
            features: "fastembed,vectordb"
            platform-name: linux-x64
            needs-vulkan: false

          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: cuda
            features: "fastembed,vectordb,cuda"
            platform-name: linux-x64
            needs-vulkan: false

          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: vulkan
            features: "fastembed,vectordb,vulkan"
            platform-name: linux-x64
            needs-vulkan: true

          # ── macOS ────────────────────────────────────────────────────────
          - platform: macos-latest
            target: aarch64-apple-darwin
            variant: cpu
            features: "fastembed,vectordb"
            platform-name: macos-arm64
            needs-vulkan: false

          - platform: macos-latest
            target: aarch64-apple-darwin
            variant: metal
            features: "fastembed,vectordb,metal"
            platform-name: macos-arm64
            needs-vulkan: false

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: marianne -> target
          key: ${{ matrix.target }}-${{ matrix.variant }}-server

      # ── CUDA ─────────────────────────────────────────────────────────────
      - name: Install CUDA Toolkit (Linux)
        if: matrix.platform == 'ubuntu-latest' && matrix.variant == 'cuda'
        id: cuda-toolkit-linux
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'local'
          linux-local-args: '["--toolkit"]'

      - name: Set CUDA env (Linux)
        if: matrix.platform == 'ubuntu-latest' && matrix.variant == 'cuda'
        run: |
          CUDA_PATH="${{ steps.cuda-toolkit-linux.outputs.CUDA_PATH }}"
          echo "CUDA_PATH=${CUDA_PATH}" >> $GITHUB_ENV
          echo "CUDACXX=${CUDA_PATH}/bin/nvcc" >> $GITHUB_ENV
          echo "CUDAHOSTCXX=/usr/bin/g++" >> $GITHUB_ENV
          echo "CMAKE_CUDA_HOST_COMPILER=/usr/bin/g++" >> $GITHUB_ENV
          echo "${CUDA_PATH}/bin" >> $GITHUB_PATH

      - name: Install CUDA Toolkit (Windows)
        if: matrix.platform == 'windows-latest' && matrix.variant == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'

      # ── Vulkan (Windows) ─────────────────────────────────────────────────
      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest' && matrix.needs-vulkan
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ── System deps ──────────────────────────────────────────────────────
      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev cmake libssl-dev build-essential gcc g++

      - name: Install Vulkan SDK (Linux)
        if: matrix.platform == 'ubuntu-latest' && matrix.needs-vulkan
        run: sudo apt-get install -y libvulkan-dev vulkan-tools glslc

      - name: Install system deps (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install protobuf cmake

      - name: Install protobuf (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install protoc --yes

      - name: Setup MSVC (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Short build path (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          echo "CARGO_TARGET_DIR=D:\cb" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path "D:\cb" -Force | Out-Null
          if ("${{ matrix.variant }}" -ne "cuda") {
            echo "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build marianne-server (Linux)
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        working-directory: marianne
        env:
          RUST_BACKTRACE: '1'
          CC: gcc
          CXX: g++
        run: cargo build -p marianne-server --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}

      - name: Build marianne-server (Windows / macOS)
        if: matrix.platform != 'ubuntu-latest'
        working-directory: marianne
        env:
          RUST_BACKTRACE: '1'
        run: cargo build -p marianne-server --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}

      # ── Package ──────────────────────────────────────────────────────────
      - name: Package (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $src = "D:\cb\${{ matrix.target }}\release\marianne-server.exe"
          if (-not (Test-Path $src)) {
            $src = "marianne\target\${{ matrix.target }}\release\marianne-server.exe"
          }
          $dest = "marianne-server-${{ matrix.platform-name }}-${{ matrix.variant }}.zip"
          Compress-Archive -Path $src -DestinationPath $dest

      - name: Package (Linux / macOS)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          BIN="marianne/target/${{ matrix.target }}/release/marianne-server"
          tar czf "marianne-server-${{ matrix.platform-name }}-${{ matrix.variant }}.tar.gz" \
            -C "$(dirname "$BIN")" "$(basename "$BIN")"

      # ── Upload ───────────────────────────────────────────────────────────
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: marianne-server-${{ matrix.platform-name }}-${{ matrix.variant }}
          path: marianne-server-${{ matrix.platform-name }}-${{ matrix.variant }}.*
          if-no-files-found: error


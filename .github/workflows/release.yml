name: Release Marianne AI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Extract version ──────────────────────────────────────────────────────
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0" >> $GITHUB_OUTPUT
          fi

  # ── Call build workflows ─────────────────────────────────────────────────
  build-client:
    needs: prepare
    uses: ./.github/workflows/build-client.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  build-server:
    needs: prepare
    uses: ./.github/workflows/build-server.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      version: ${{ needs.prepare.outputs.version }}

  # ── Create GitHub Release ────────────────────────────────────────────────
  release:
    needs: [prepare, build-client, build-server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Marianne AI ${{ github.ref_name }}"
          draft: false
          generate_release_notes: true
          body: |
            ## 🇫🇷 Marianne AI ${{ github.ref_name }}

            Assistant administratif français. Architecture client-serveur avec IA déportée sur le serveur.

            ---

            ### 🖥️ Application Client (Electron)

            Client desktop qui se connecte au serveur marianne-server. Accès aux fichiers locaux et exécution de commandes.

            | Système | Artefact |
            |---------|----------|
            | **Windows** | `marianne-client-windows-x64` (`.exe`) |
            | **Linux** | `marianne-client-linux-x64` (`.AppImage` / `.deb` / `.rpm`) |
            | **macOS** | `marianne-client-macos-arm64` (`.dmg`) |

            **Configuration :**
            - Au premier lancement, configurez l'URL du serveur marianne-server
            - Par défaut : `http://localhost:3000`
            - Pour un serveur distant : `http://votre-serveur:3000`

            ---

            ### ⚙️ Serveur HTTP (`marianne-server`)

            Serveur backend avec IA embarquée. Peut tourner sur une machine dédiée, un NAS, ou un serveur distant.

            **Choisissez la variante adaptée à votre matériel :**

            | Système | Variante | Accélération GPU | Archive |
            |---------|----------|------------------|---------|
            | **Windows** | CPU | ❌ CPU uniquement | `marianne-server-windows-x64-cpu.zip` |
            | **Windows** | CUDA | ✅ GPU NVIDIA | `marianne-server-windows-x64-cuda.zip` |
            | **Windows** | Vulkan | ✅ GPU universel | `marianne-server-windows-x64-vulkan.zip` |
            | **Linux** | CPU | ❌ CPU uniquement | `marianne-server-linux-x64-cpu.tar.gz` |
            | **Linux** | CUDA | ✅ GPU NVIDIA | `marianne-server-linux-x64-cuda.tar.gz` |
            | **Linux** | Vulkan | ✅ GPU universel | `marianne-server-linux-x64-vulkan.tar.gz` |
            | **macOS** | CPU | ❌ CPU uniquement | `marianne-server-macos-arm64-cpu.tar.gz` |
            | **macOS** | Metal | ✅ GPU Apple Silicon | `marianne-server-macos-arm64-metal.tar.gz` |

            **Quelle variante choisir ?**
            - **NVIDIA RTX/GTX** → CUDA (meilleure performance) ou Vulkan (fallback)
            - **AMD/Intel** → Vulkan
            - **Apple Silicon** → Metal
            - **Pas de GPU ou CPU puissant** → CPU

            ```bash
            # Lancer le serveur (écoute 127.0.0.1:3000 par défaut)
            ./marianne-server

            # Exposer sur le réseau local
            ./marianne-server --bind 0.0.0.0:3000

            # Spécifier un répertoire de données
            ./marianne-server --data-dir /var/lib/marianne
            ```

            ---

            ### ✨ Fonctionnalités
            - **Architecture client-serveur** : serveur puissant + clients légers
            - LLM embarqué côté serveur (modèle téléchargé au premier lancement)
            - RAG hybride : base vectorielle LanceDB + graphe de connaissances
            - Corpus juridique français (CAF, URSSAF, retraite, logement, travail…)
            - Recherche web sur sources officielles en temps réel
            - Analyse de documents PDF/TXT/MD via le client
            - **Accélération GPU côté serveur** : CUDA (NVIDIA), Vulkan (universel), Metal (Apple Silicon), ou CPU uniquement
          files: artifacts/**/*


name: Release Marianne AI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Extract version ──────────────────────────────────────────────────────
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0" >> $GITHUB_OUTPUT
          fi

  # ── Call build workflows ─────────────────────────────────────────────────
  build-client:
    needs: prepare
    uses: ./.github/workflows/build-client.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  build-server:
    needs: prepare
    uses: ./.github/workflows/build-server.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  # ── Create GitHub Release ────────────────────────────────────────────────
  release:
    needs: [prepare, build-client, build-server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Marianne AI ${{ github.ref_name }}"
          draft: false
          generate_release_notes: true
          body: |
            ## 🇫🇷 Marianne AI ${{ github.ref_name }}

            Assistant administratif français, 100% local et privé. Fonctionne en architecture client + serveur.

            ---

            ### 🖥️ Application Client (à installer sur votre PC)

            > Le client se connecte au serveur Marianne pour accéder à l'IA.

            | Système | Téléchargement | Type |
            |---------|---------------|------|
            | **Windows** | `Marianne AI Setup X.X.X.exe` | Installateur (recommandé) |
            | **Windows** | `Marianne AI X.X.X.exe` | Portable (sans installation) |
            | **macOS** | `Marianne AI-X.X.X-arm64.dmg` | Installateur |
            | **Linux** | `Marianne AI-X.X.X.AppImage` | Portable (universel) |
            | **Linux** | `marianne-client_X.X.X_amd64.deb` | Paquet Debian/Ubuntu |

            > 💡 **Premier lancement** : configurez l'URL du serveur (par défaut `http://localhost:3000`).

            ---

            ### ⚙️ Serveur IA (`marianne-server`)

            > Le serveur fait tourner l'IA. Il peut être sur le même PC ou sur une machine dédiée.

            **Choisissez la variante adaptée à votre carte graphique :**

            | Système | Votre GPU | Archive à télécharger |
            |---------|-----------|----------------------|
            | **Windows** | NVIDIA RTX/GTX | `marianne-server-windows-x64-cuda.zip` |
            | **Windows** | AMD / Intel / Autre | `marianne-server-windows-x64-vulkan.zip` |
            | **Windows** | Pas de GPU | `marianne-server-windows-x64-cpu.zip` |
            | **Linux** | NVIDIA RTX/GTX | `marianne-server-linux-x64-cuda.tar.gz` |
            | **Linux** | AMD / Intel / Autre | `marianne-server-linux-x64-vulkan.tar.gz` |
            | **Linux** | Pas de GPU | `marianne-server-linux-x64-cpu.tar.gz` |
            | **macOS** | Apple Silicon (M1/M2/M3/M4) | `marianne-server-macos-arm64-metal.tar.gz` |
            | **macOS** | Pas de GPU dédié | `marianne-server-macos-arm64-cpu.tar.gz` |

            ```bash
            # Lancer le serveur
            ./marianne-server

            # Exposer sur le réseau local
            ./marianne-server --bind 0.0.0.0:3000
            ```

            ---

            ### ✨ Fonctionnalités
            - 🔒 **100% local** : vos données restent sur votre machine
            - 🧠 LLM embarqué côté serveur (modèle téléchargé au premier lancement)
            - 📚 Base de connaissances juridique française (CAF, URSSAF, retraite, logement, travail…)
            - 🔍 Recherche web sur sources officielles en temps réel
            - 📄 Analyse de documents PDF/TXT/MD
            - 🚀 Accélération GPU : CUDA, Vulkan, Metal ou CPU
          files: artifacts/**/*


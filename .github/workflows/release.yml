name: Release Marianne AI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Extract version ──────────────────────────────────────────────────────
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0" >> $GITHUB_OUTPUT
          fi

  # ── Call build workflows ─────────────────────────────────────────────────
  build-desktop:
    needs: prepare
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  build-server:
    needs: prepare
    uses: ./.github/workflows/build-server.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  build-web:
    needs: prepare
    uses: ./.github/workflows/build-web.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  # ── Create GitHub Release ────────────────────────────────────────────────
  release:
    needs: [prepare, build-desktop, build-server, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Marianne AI ${{ github.ref_name }}"
          draft: false
          generate_release_notes: true
          body: |
            ## 🇫🇷 Marianne AI ${{ github.ref_name }}

            Assistant administratif français 100% local avec IA embarquée.

            ---

            ### 🖥️ Application Desktop (Tauri)

            Interface graphique complète — le modèle IA (~2.2 Go) est téléchargé automatiquement au premier lancement.

            **Choisissez la variante adaptée à votre matériel :**

            | Système | Variante | Accélération GPU | Artefact |
            |---------|----------|------------------|----------|
            | **Windows** | CPU | ❌ CPU uniquement | `marianne-desktop-windows-x64-cpu` (`.msi` / `.exe`) |
            | **Windows** | CUDA | ✅ GPU NVIDIA (RTX, GTX) | `marianne-desktop-windows-x64-cuda` (`.msi` / `.exe`) |
            | **Windows** | Vulkan | ✅ GPU universel (NVIDIA, AMD, Intel) | `marianne-desktop-windows-x64-vulkan` (`.msi` / `.exe`) |
            | **Linux** | CPU | ❌ CPU uniquement | `marianne-desktop-linux-x64-cpu` (`.deb` / `.AppImage`) |
            | **Linux** | CUDA | ✅ GPU NVIDIA (RTX, GTX) | `marianne-desktop-linux-x64-cuda` (`.deb` / `.AppImage`) |
            | **Linux** | Vulkan | ✅ GPU universel (NVIDIA, AMD, Intel) | `marianne-desktop-linux-x64-vulkan` (`.deb` / `.AppImage`) |
            | **macOS** | CPU | ❌ CPU uniquement | `marianne-desktop-macos-arm64-cpu` (`.dmg`) |
            | **macOS** | Metal | ✅ GPU Apple Silicon (M1/M2/M3) | `marianne-desktop-macos-arm64-metal` (`.dmg`) |

            **Quelle variante choisir ?**
            - **NVIDIA RTX/GTX** → CUDA (meilleure performance) ou Vulkan (fallback)
            - **AMD/Intel** → Vulkan
            - **Apple Silicon** → Metal
            - **Pas de GPU ou CPU puissant** → CPU

            ---

            ### ⚙️ Serveur HTTP (`marianne-server`)

            Binaire standalone exposant l'API REST + SSE. Idéal pour machine dédiée, NAS ou serveur distant.

            **Choisissez la variante adaptée à votre matériel :**

            | Système | Variante | Accélération GPU | Archive |
            |---------|----------|------------------|---------|
            | **Windows** | CPU | ❌ CPU uniquement | `marianne-server-windows-x64-cpu.zip` |
            | **Windows** | CUDA | ✅ GPU NVIDIA | `marianne-server-windows-x64-cuda.zip` |
            | **Windows** | Vulkan | ✅ GPU universel | `marianne-server-windows-x64-vulkan.zip` |
            | **Linux** | CPU | ❌ CPU uniquement | `marianne-server-linux-x64-cpu.tar.gz` |
            | **Linux** | CUDA | ✅ GPU NVIDIA | `marianne-server-linux-x64-cuda.tar.gz` |
            | **Linux** | Vulkan | ✅ GPU universel | `marianne-server-linux-x64-vulkan.tar.gz` |
            | **macOS** | CPU | ❌ CPU uniquement | `marianne-server-macos-arm64-cpu.tar.gz` |
            | **macOS** | Metal | ✅ GPU Apple Silicon | `marianne-server-macos-arm64-metal.tar.gz` |

            ```bash
            # Lancer le serveur (écoute 127.0.0.1:3000 par défaut)
            ./marianne-server

            # Exposer sur le réseau local
            ./marianne-server --bind 0.0.0.0:3000

            # Spécifier un répertoire de données
            ./marianne-server --data-dir /var/lib/marianne
            ```

            ---

            ### 🌐 Client Web (`marianne-web`)

            Fichiers statiques Svelte à déployer face au serveur HTTP.
            Décompresser l'archive et servir le dossier `dist/` via nginx, Caddy ou tout autre serveur HTTP.

            | Artefact | Contenu |
            |---|---|
            | `marianne-web-client` | `dist/` — HTML/CSS/JS statiques |

            ```nginx
            # Exemple nginx
            server {
                listen 80;
                root /var/www/marianne/dist;
                location / { try_files $uri /index.html; }
            }
            ```

            **Déploiement avec Docker** :
            ```bash
            # Extraire l'archive
            unzip marianne-web-client-*.zip

            # Lancer nginx avec le dossier dist/
            docker run --name marianne-web \
              -p 8080:80 \
              -v "$(pwd)/dist:/usr/share/nginx/html:ro" \
              -d nginx

            # Accéder à l'application : http://localhost:8080
            ```

            ---

            ### ✨ Fonctionnalités
            - LLM embarqué (modèle téléchargé au premier lancement)
            - RAG hybride : base vectorielle LanceDB + graphe de connaissances
            - Corpus juridique français (CAF, URSSAF, retraite, logement, travail…)
            - Recherche web sur sources officielles en temps réel
            - Analyse de documents PDF/TXT/MD
            - **Accélération GPU disponible** : CUDA (NVIDIA), Vulkan (universel), Metal (Apple Silicon), ou CPU uniquement
          files: artifacts/**/*


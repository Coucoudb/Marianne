name: Build Web Client (Svelte)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        type: string
        default: '0.0.0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        type: string
        default: '0.0.0'

jobs:
  build-web:
    name: Web Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marianne/marianne-web/package-lock.json

      - name: Install deps
        working-directory: marianne/marianne-web
        run: npm ci

      - name: Build
        working-directory: marianne/marianne-web
        env:
          VITE_APP_VERSION: ${{ inputs.version }}
        run: npm run build

      - name: Package dist/
        run: |
          cd marianne/marianne-web
          zip -r "../../marianne-web-client-${{ inputs.version }}.zip" dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: marianne-web-client
          path: marianne-web-client-*.zip

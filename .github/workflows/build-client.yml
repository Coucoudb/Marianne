name: Build Client

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        type: string
        default: '0.0.0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        type: string
        default: '0.0.0'

env:
  NODE_VERSION: '20'

jobs:
  build-client:
    name: Client (${{ matrix.platform-name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────────────────────
          - platform: windows-latest
            platform-name: windows-x64

          # ── Linux ────────────────────────────────────────────────────────
          - platform: ubuntu-latest
            platform-name: linux-x64

          # ── macOS ────────────────────────────────────────────────────────
          - platform: macos-latest
            platform-name: macos-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: marianne/marianne-client/package-lock.json

      # ── Linux system dependencies ────────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxtst6 \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            libxss1 \
            libasound2t64

      # ── Set version ──────────────────────────────────────────────────────
      - name: Set version
        shell: bash
        working-directory: marianne/marianne-client
        run: |
          VERSION="${{ inputs.version }}"
          if [ "$VERSION" != "0.0.0" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi

      # ── Install & Build ──────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: marianne/marianne-client
        run: npm ci

      - name: Build application
        working-directory: marianne/marianne-client
        run: npm run build

      # ── Package ──────────────────────────────────────────────────────────
      - name: Package (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: marianne/marianne-client
        run: npm run package:win

      - name: Package (Linux)
        if: matrix.platform == 'ubuntu-latest'
        working-directory: marianne/marianne-client
        run: npm run package:linux

      - name: Package (macOS)
        if: startsWith(matrix.platform, 'macos')
        working-directory: marianne/marianne-client
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ── Upload ───────────────────────────────────────────────────────────
      - name: Upload (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: marianne-client-${{ matrix.platform-name }}
          path: |
            marianne/marianne-client/release/*.exe
            marianne/marianne-client/release/*.msi
          if-no-files-found: error

      - name: Upload (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: marianne-client-${{ matrix.platform-name }}
          path: |
            marianne/marianne-client/release/*.AppImage
            marianne/marianne-client/release/*.deb
            marianne/marianne-client/release/*.rpm
          if-no-files-found: error

      - name: Upload (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: marianne-client-${{ matrix.platform-name }}
          path: |
            marianne/marianne-client/release/*.dmg
            marianne/marianne-client/release/*.zip
          if-no-files-found: error


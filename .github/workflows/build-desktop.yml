name: Build Desktop (Tauri)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        type: string
        default: '0.0.0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        type: string
        default: '0.0.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-desktop:
    name: Desktop (${{ matrix.platform-name }}-${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────────────────────
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            variant: cpu
            features: "custom-protocol,fastembed,vectordb"
            platform-name: windows-x64
            needs-vulkan: false

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            variant: cuda
            features: "custom-protocol,fastembed,vectordb,cuda"
            platform-name: windows-x64
            needs-vulkan: false

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            variant: vulkan
            features: "custom-protocol,fastembed,vectordb,vulkan"
            platform-name: windows-x64
            needs-vulkan: true

          # ── Linux ────────────────────────────────────────────────────────
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: cpu
            features: "custom-protocol,fastembed,vectordb"
            platform-name: linux-x64
            needs-vulkan: false

          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: cuda
            features: "custom-protocol,fastembed,vectordb,cuda"
            platform-name: linux-x64
            needs-vulkan: false

          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: vulkan
            features: "custom-protocol,fastembed,vectordb,vulkan"
            platform-name: linux-x64
            needs-vulkan: true

          # ── macOS ────────────────────────────────────────────────────────
          - platform: macos-latest
            target: aarch64-apple-darwin
            variant: cpu
            features: "custom-protocol,fastembed,vectordb"
            platform-name: macos-arm64
            needs-vulkan: false

          - platform: macos-latest
            target: aarch64-apple-darwin
            variant: metal
            features: "custom-protocol,fastembed,vectordb,metal"
            platform-name: macos-arm64
            needs-vulkan: false

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" marianne/src-tauri/tauri.conf.json
            sed -i '' "1,/^version = \".*\"/{s/^version = \".*\"/version = \"$VERSION\"/;}" marianne/src-tauri/Cargo.toml
          else
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" marianne/src-tauri/tauri.conf.json
            sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" marianne/src-tauri/Cargo.toml
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: marianne -> target
          key: ${{ matrix.target }}-${{ matrix.variant }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: marianne/marianne-web
        run: npm install

      # ── CUDA ─────────────────────────────────────────────────────────────
      - name: Install CUDA Toolkit (Linux)
        if: matrix.platform == 'ubuntu-latest' && matrix.variant == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'

      - name: Install CUDA Toolkit (Windows)
        if: matrix.platform == 'windows-latest' && matrix.variant == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'

      # ── Vulkan (Windows) ─────────────────────────────────────────────────
      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest' && matrix.needs-vulkan
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Verify Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest' && matrix.needs-vulkan
        shell: pwsh
        run: |
          $glslc = Join-Path $env:VULKAN_SDK "Bin\glslc.exe"
          if (-not (Test-Path $glslc)) { Write-Error "Missing glslc"; exit 1 }

      # ── System deps ──────────────────────────────────────────────────────
      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler libprotobuf-dev cmake \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev

      - name: Install Vulkan SDK (Linux)
        if: matrix.platform == 'ubuntu-latest' && matrix.needs-vulkan
        run: sudo apt-get install -y libvulkan-dev vulkan-tools glslc

      - name: Install system deps (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install protobuf cmake

      - name: Set macOS deployment target
        if: startsWith(matrix.platform, 'macos')
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV

      - name: Install protobuf (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install protoc --yes

      - name: Setup MSVC (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Short build path (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          echo "CARGO_TARGET_DIR=D:\cb" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path "D:\cb" -Force | Out-Null
          echo "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── Build ────────────────────────────────────────────────────────────
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build Tauri desktop
        working-directory: marianne
        env:
          RUST_BACKTRACE: '1'
        run: >
          cargo tauri build
          --target ${{ matrix.target }}
          -- --no-default-features --features ${{ matrix.features }}

      # ── Upload ───────────────────────────────────────────────────────────
      - name: Upload (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: marianne-desktop-${{ matrix.platform-name }}-${{ matrix.variant }}
          path: |
            D:/cb/${{ matrix.target }}/release/bundle/msi/*.msi
            D:/cb/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: marianne-desktop-${{ matrix.platform-name }}-${{ matrix.variant }}
          path: |
            marianne/target/${{ matrix.target }}/release/bundle/deb/*.deb
            marianne/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: marianne-desktop-${{ matrix.platform-name }}-${{ matrix.variant }}
          path: marianne/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
